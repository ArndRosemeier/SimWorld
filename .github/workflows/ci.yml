name: CI
on:
  push:
    branches: [main]
  pull_request:

# One lean job (docs/CI.md): typecheck, the fast tests under their budget, the build.
# A new push to a PR cancels that PR's older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Hard cap: if CI ever needs longer, the suite has grown past its budget (tools/ci/budget.json).
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
