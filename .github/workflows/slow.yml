name: Slow tests
# Long simulation soaks and browser checks (test/slow/, docs/CI.md). Never on pull requests:
# start it by hand (Actions → Slow tests → Run workflow, any branch) after big changes.
on:
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:slow
