name: Looks
# The looks check (docs/CI.md, slow tier; tools/looks/check.mjs): every material kind in every variant drawn in
# headless Chromium and judged (black, blown-out white, NaN, magenta, nothing drawn), plus fixed-camera town shots
# compared with their stored colours. Nightly on main and by hand (Actions → Looks → Run workflow, any branch);
# never on pull requests. A failing night opens (or comments on) the issue labelled `looks`, which is how it gets
# read; the contact sheet and the shots are the run's artifact.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: looks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  looks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - id: check
        run: npm run looks -- --out looks-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: looks
          path: looks-out
          retention-days: 14
      - if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let problems = ['the check did not finish: see the run log'];
            try { problems = JSON.parse(fs.readFileSync('looks-out/looks-report.json', 'utf8')).problems; } catch {}
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const list = problems.slice(0, 60).map((p) => `- ${p}`).join('\n') + (problems.length > 60 ? `\n- … and ${problems.length - 60} more` : '');
            const body = `The nightly looks check failed on ${context.sha.slice(0, 7)} (${problems.length} problems).\n\n${list}\n\nContact sheet and shots: the \`looks\` artifact of [the run](${run}). A look that changed on purpose updates the baseline: \`npm run looks -- --update\`.`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, labels: 'looks', state: 'open' });
            if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title: 'Looks check failing', labels: ['looks'], body });
