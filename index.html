<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SimWorld</title>
    <style>
      html, body { margin: 0; height: 100%; background: #050607; color: #cfd6dc; font: 13px/1.4 'Alegreya Sans', system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      /* The loading screen (src/app/loadingScreen.ts), drawn before any script runs: the theme's values
         (src/app/theme.ts: fontDisplay, accent, inkFaint, line) mirrored here, as its CSS is not in yet. */
      #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background: #050607; }
      #loading .name { font: 400 34px/1 'IM Fell English', Georgia, serif; letter-spacing: 0.24em; text-indent: 0.24em; color: #ece3d0; text-transform: uppercase; text-shadow: 0 0 18px #e9b85c33; }
      #loading .bar { width: min(280px, 70vw); height: 2px; margin-top: 22px; background: #4f423255; overflow: hidden; }
      #loading .bar i { display: block; height: 100%; width: 0; background: #e9b85c; box-shadow: 0 0 8px #e9b85c88; transition: width 0.3s; }
      #loading .step { margin-top: 10px; min-height: 1.4em; color: #7a6f5e; font: 13px/1.4 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.06em; }
      /* The version and the What's new panel (src/app/whatsNew.ts), above the loading screen. */
      .wn-button { position: fixed; right: 12px; bottom: 10px; z-index: 25; padding: 5px 10px; border: 1px solid #4f4232aa; border-radius: 3px; background: #050607cc; color: #b9ad96; font: 12px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.06em; cursor: pointer; }
      .wn-button:hover, .wn-button:focus-visible { color: #ece3d0; border-color: #e9b85c; outline: none; }
      .wn-backdrop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: #050607b3; }
      .wn-panel { display: flex; flex-direction: column; width: min(560px, 100%); max-height: min(80vh, 720px); background: #0d0f11; border: 1px solid #4f4232; box-shadow: 0 8px 40px #000a; }
      .wn-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #4f423288; }
      .wn-head h2 { margin: 0; font: 400 22px/1 'IM Fell English', Georgia, serif; letter-spacing: 0.08em; color: #ece3d0; }
      .wn-close { padding: 4px 10px; border: 1px solid #4f4232; border-radius: 3px; background: none; color: #b9ad96; font: inherit; cursor: pointer; }
      .wn-close:hover, .wn-close:focus-visible { color: #ece3d0; border-color: #e9b85c; outline: none; }
      .wn-list { overflow-y: auto; padding: 4px 18px 16px; }
      .wn-release h3 { margin: 16px 0 6px; font: 600 14px/1.3 'Alegreya Sans', system-ui, sans-serif; color: #ece3d0; }
      .wn-version { margin-right: 4px; color: #e9b85c; font-weight: 400; }
      .wn-release ul { margin: 0; padding-left: 18px; color: #cfd6dc; }
      .wn-release li { margin: 3px 0; }
      /* The sound control (src/app/soundPanel.ts), above What's new. */
      .snd-button { position: fixed; right: 12px; bottom: 44px; z-index: 25; padding: 5px 10px; border: 1px solid #4f4232aa; border-radius: 3px; background: #050607cc; color: #b9ad96; font: 12px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.06em; cursor: pointer; }
      .snd-button:hover, .snd-button:focus-visible { color: #ece3d0; border-color: #e9b85c; outline: none; }
      .snd-panel { position: fixed; right: 12px; bottom: 78px; z-index: 30; width: min(300px, calc(100vw - 24px)); padding: 12px 16px 14px; background: #0d0f11f2; border: 1px solid #4f4232; box-shadow: 0 8px 40px #000a; color: #cfd6dc; font: 13px/1.3 'Alegreya Sans', system-ui, sans-serif; }
      .snd-panel h2 { margin: 0 0 8px; font: 400 18px/1 'IM Fell English', Georgia, serif; letter-spacing: 0.08em; color: #ece3d0; }
      .snd-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0; }
      .snd-row span { flex: 1; }
      .snd-row input[type=range] { flex: none; width: 130px; accent-color: #e9b85c; }
      .snd-mute input { accent-color: #e9b85c; }
      /* The town's weekly paper (src/app/paperPanel.ts), beside Sound in play. */
      .pp-button { position: fixed; right: 84px; bottom: 44px; z-index: 25; padding: 5px 10px; border: 1px solid #4f4232aa; border-radius: 3px; background: #050607cc; color: #b9ad96; font: 12px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.06em; cursor: pointer; }
      .pp-button:hover, .pp-button:focus-visible { color: #ece3d0; border-color: #e9b85c; outline: none; }
      .pp-backdrop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: #050607b3; }
      .pp-panel { position: relative; width: min(640px, 100%); max-height: min(86vh, 860px); overflow-y: auto; background: #efe8d8; color: #1d1b17; box-shadow: 0 8px 40px #000c; font: 15px/1.4 Georgia, 'Times New Roman', serif; }
      .pp-close { position: absolute; right: 10px; top: 10px; padding: 3px 9px; border: 1px solid #1d1b1766; border-radius: 3px; background: none; color: #1d1b17; font: 12px/1.3 'Alegreya Sans', system-ui, sans-serif; cursor: pointer; }
      .pp-body { padding: 18px 26px 24px; }
      .pp-mast { text-align: center; border-bottom: 3px double #1d1b17; padding-bottom: 6px; margin-bottom: 14px; }
      .pp-mast h2 { margin: 0; font: 400 34px/1.1 'IM Fell English', Georgia, serif; letter-spacing: 0.02em; }
      .pp-dated { margin-top: 4px; font: 12px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
      .pp-lead h3 { margin: 0 0 6px; font: 700 26px/1.15 Georgia, serif; }
      .pp-lead p { margin: 0 0 12px; font-size: 16px; }
      .pp-section { border-top: 1px solid #1d1b1755; margin-top: 12px; padding-top: 8px; }
      .pp-section h5 { margin: 0 0 6px; font: 600 12px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
      .pp-story h4 { margin: 6px 0 2px; font: 700 16px/1.25 Georgia, serif; }
      .pp-story p { margin: 0; }
      .pp-empty { font-style: italic; text-align: center; }
      /* The town map (src/app/mapPanel.ts), beside the paper in play. */
      .map-button { position: fixed; right: 150px; bottom: 44px; z-index: 25; padding: 5px 10px; border: 1px solid #4f4232aa; border-radius: 3px; background: #050607cc; color: #b9ad96; font: 12px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.06em; cursor: pointer; }
      .map-button:hover, .map-button:focus-visible { color: #ece3d0; border-color: #e9b85c; outline: none; }
      .map-backdrop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: #050607b3; }
      .map-panel { position: relative; width: min(1000px, 100%); height: min(86vh, 900px); background: #efe8d8; box-shadow: 0 8px 40px #000c; }
      .map-canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
      .map-tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
      .map-tools button { padding: 3px 9px; border: 1px solid #1d1b1766; border-radius: 3px; background: #efe8d8e6; color: #1d1b17; font: 13px/1.3 'Alegreya Sans', system-ui, sans-serif; cursor: pointer; }
      #hud { position: fixed; left: 12px; top: 10px; pointer-events: none; white-space: pre; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <div id="loading"><div class="name">SimWorld</div><div class="bar"><i></i></div><div class="step">Loading</div></div>
    <noscript><p style="position:fixed;inset:0;z-index:30;margin:0;padding:40vh 16px 0;text-align:center;background:#050607">SimWorld needs JavaScript.</p></noscript>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
