<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Total Town</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #050607; color: #cfd6dc; font: 13px/1.4 'Alegreya Sans', system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
      /* The title screen (src/app/title.ts), painted before any script runs: a dusk sky until its canvas draws the town.
         The theme's values (fontDisplay, accent, inkFaint, line) mirrored here, as no other CSS is in yet. */
      #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; padding: 16px; padding-top: 17vh; box-sizing: border-box; background: linear-gradient(#060b18, #14203a 45%, #3b3550 68%, #a8674a 80%, #2a1a16); transition: opacity 1.2s ease; cursor: default; }
      #loading.ti-out { opacity: 0; pointer-events: none; }
      #loading .ti-scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
      #loading .name { margin: 0; font: 400 clamp(40px, 9vw, 96px)/1 'IM Fell English', Georgia, serif; letter-spacing: 0.16em; text-indent: 0.16em; color: #ece3d0; text-transform: uppercase; text-align: center; text-shadow: 0 0 28px #e9b85c44, 0 2px 4px #000; }
      #loading .ti-badge { margin-top: 14px; padding: 3px 12px 4px; border: 1px solid #e9b85c; border-radius: 3px; color: #e9b85c; background: #05060766; font: 600 12px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; transform: rotate(-3deg); box-shadow: 0 0 12px #e9b85c33; }
      #loading .ti-go { margin-top: 9vh; min-height: 44px; display: flex; align-items: center; }
      #loading .ti-click { color: #ece3d0; font: 18px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.14em; text-shadow: 0 1px 3px #000; animation: ti-pulse 2.4s ease-in-out infinite; }
      @keyframes ti-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      #loading .ti-enter { padding: 10px 28px; border: 1px solid #e9b85c; border-radius: 3px; background: #050607b3; color: #ece3d0; font: 18px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.12em; cursor: pointer; box-shadow: 0 0 18px #e9b85c44; }
      #loading .ti-enter:hover, #loading .ti-enter:focus-visible { background: #e9b85c; color: #050607; outline: none; }
      #loading .bar { width: min(280px, 70vw); height: 2px; margin-top: 18px; background: #4f423255; overflow: hidden; transition: opacity 1s; }
      #loading .bar i { display: block; height: 100%; width: 0; background: #e9b85c; box-shadow: 0 0 8px #e9b85c88; transition: width 0.3s; }
      #loading.ti-ready .bar { opacity: 0; }
      #loading .step { margin-top: 8px; min-height: 1.4em; color: #b9ad96; font: 13px/1.4 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.06em; text-shadow: 0 1px 2px #000; text-align: center; }
      #loading.ti-failed .step { color: #ece3d0; }
      /* The frame's bar and Menu wait until the title is gone (src/app/shell.ts). */
      body.title-up .sh-bar, body.title-up .sh-tools { display: none; }
      #loading .ti-mute { position: absolute; right: 12px; top: 10px; display: flex; padding: 6px 8px; border: 1px solid #4f4232aa; border-radius: 3px; background: #050607cc; color: #b9ad96; cursor: pointer; }
      #loading .ti-mute:hover, #loading .ti-mute:focus-visible { color: #ece3d0; border-color: #e9b85c; outline: none; }
      /* The version and the What's new panel (src/app/whatsNew.ts), above the loading screen. */
      .wn-button { position: fixed; right: 12px; bottom: 10px; z-index: 25; padding: 5px 10px; border: 1px solid #4f4232aa; border-radius: 3px; background: #050607cc; color: #b9ad96; font: 12px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.06em; cursor: pointer; }
      .wn-button:hover, .wn-button:focus-visible { color: #ece3d0; border-color: #e9b85c; outline: none; }
      .wn-backdrop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: #050607b3; }
      .wn-panel { display: flex; flex-direction: column; width: min(560px, 100%); max-height: min(80vh, 720px); background: #0d0f11; border: 1px solid #4f4232; box-shadow: 0 8px 40px #000a; }
      .wn-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #4f423288; }
      .wn-head h2 { margin: 0; font: 400 22px/1 'IM Fell English', Georgia, serif; letter-spacing: 0.08em; color: #ece3d0; }
      .wn-close { padding: 4px 10px; border: 1px solid #4f4232; border-radius: 3px; background: none; color: #b9ad96; font: inherit; cursor: pointer; }
      .wn-close:hover, .wn-close:focus-visible { color: #ece3d0; border-color: #e9b85c; outline: none; }
      .wn-list { overflow-y: auto; padding: 4px 18px 16px; }
      .wn-release h3 { margin: 16px 0 6px; font: 600 14px/1.3 'Alegreya Sans', system-ui, sans-serif; color: #ece3d0; }
      .wn-version { margin-right: 4px; color: #e9b85c; font-weight: 400; }
      .wn-release ul { margin: 0; padding-left: 18px; color: #cfd6dc; }
      .wn-release li { margin: 3px 0; }
      /* The sound control (src/app/soundPanel.ts), above What's new. */
      .snd-panel { position: fixed; right: calc(var(--right) + 12px); top: 44px; z-index: 30; width: min(300px, calc(100vw - 24px)); padding: 12px 16px 14px; background: #0d0f11f2; border: 1px solid #4f4232; box-shadow: 0 8px 40px #000a; color: #cfd6dc; font: 13px/1.3 'Alegreya Sans', system-ui, sans-serif; }
      .snd-panel h2 { margin: 0 0 8px; font: 400 18px/1 'IM Fell English', Georgia, serif; letter-spacing: 0.08em; color: #ece3d0; }
      .snd-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0; }
      .snd-row span { flex: 1; }
      .snd-row input[type=range] { flex: none; width: 130px; accent-color: #e9b85c; }
      .snd-mute input { accent-color: #e9b85c; }
      /* The character picker (src/app/picker.ts): who will you be, over the town from above. */
      .pk-panel { position: fixed; right: calc(var(--right) + 12px); top: 44px; bottom: 12px; z-index: 22; display: flex; flex-direction: column; gap: 8px; width: min(400px, calc(100vw - 24px)); padding: 14px 14px 10px; box-sizing: border-box; background: #0d0f11e6; border: 1px solid #4f4232; box-shadow: 0 8px 40px #000a; }
      .pk-head { display: flex; align-items: baseline; gap: 10px; }
      .pk-head h2 { margin: 0; flex: 1; font: 400 22px/1 'IM Fell English', Georgia, serif; letter-spacing: 0.08em; color: #ece3d0; }
      .pk-count { color: #7a6f5e; font-size: 12px; }
      .pk-panel button, .pk-panel select, .pk-panel input, .pl-panel button, .pl-menu button { font: inherit; color: #b9ad96; background: none; border: 1px solid #4f4232; border-radius: 3px; padding: 4px 9px; cursor: pointer; }
      .pk-panel button:hover, .pk-panel button:focus-visible, .pk-panel select:focus-visible, .pk-panel input:focus-visible, .pl-panel button:hover, .pl-panel button:focus-visible, .pl-menu button:hover, .pl-menu button:focus-visible { color: #ece3d0; border-color: #e9b85c; outline: none; }
      .pk-panel select option { background: #0d0f11; }
      .pk-search { width: 100%; box-sizing: border-box; cursor: text; }
      .pk-chips { display: flex; flex-wrap: wrap; gap: 5px; }
      .pk-chip { padding: 2px 8px !important; font-size: 12px !important; border-radius: 10px !important; }
      .pk-chip[aria-pressed=true] { color: #050607 !important; background: #e9b85c !important; border-color: #e9b85c !important; }
      .pk-row { display: flex; gap: 6px; }
      .pk-row select { flex: 1; min-width: 0; }
      .pk-list { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
      .pk-card { padding: 8px 10px; margin: 4px 0; border: 1px solid transparent; border-radius: 3px; cursor: pointer; }
      .pk-card:hover, .pk-card:focus-visible { border-color: #4f4232; outline: none; }
      .pk-open { border-color: #e9b85c88; background: #e9b85c0d; }
      .pk-card h3 { margin: 0; font: 600 14px/1.3 'Alegreya Sans', system-ui, sans-serif; color: #ece3d0; }
      .pk-age { color: #7a6f5e; font-weight: 400; }
      .pk-line { margin: 2px 0 0; color: #cfd6dc; }
      .pk-home { margin: 6px 0 0; color: #b9ad96; }
      .pk-sits { margin: 6px 0 0; padding-left: 18px; color: #cfd6dc; }
      .pk-secret { color: #e9b85c; }
      .pk-only { color: #7a6f5e; }
      .pk-be { margin-top: 8px; color: #050607 !important; background: #e9b85c !important; border-color: #e9b85c !important; font-weight: 600 !important; }
      .pk-more { width: 100%; margin: 6px 0; }
      .pk-none { color: #7a6f5e; }
      /* Playing as an inhabitant (src/app/playPanel.ts). */
      .pl-panel { position: fixed; left: 12px; bottom: 12px; z-index: 22; width: min(340px, calc(100vw - 24px)); padding: 12px 14px; box-sizing: border-box; background: #0d0f11e6; border: 1px solid #4f4232; box-shadow: 0 8px 40px #000a; }
      .pl-hidden { display: none; }
      .pl-panel h2 { margin: 0; font: 400 20px/1.1 'IM Fell English', Georgia, serif; letter-spacing: 0.06em; color: #ece3d0; }
      .pl-age { color: #7a6f5e; font: 400 14px 'Alegreya Sans', system-ui, sans-serif; }
      .pl-occ { margin: 2px 0 0; color: #b9ad96; }
      .pl-doing { margin: 6px 0; color: #cfd6dc; }
      .pl-needs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; margin: 8px 0; font-size: 12px; color: #7a6f5e; }
      .pl-need { display: flex; align-items: center; gap: 6px; }
      .pl-need > span:first-child { width: 58px; }
      .pl-track { flex: 1; height: 3px; background: #4f423255; }
      .pl-track i { display: block; height: 100%; background: #b9ad96; transition: width 0.5s; }
      .pl-track i.pl-low { background: #d9694f; }
      .pl-buttons { display: flex; flex-wrap: wrap; gap: 5px; }
      .pl-auto[aria-pressed=true] { color: #e9b85c !important; border-color: #e9b85c88 !important; }
      .pl-menu { position: fixed; left: 12px; bottom: 260px; z-index: 30; display: flex; flex-direction: column; width: min(360px, calc(100vw - 24px)); max-height: calc(100vh - 330px); background: #0d0f11f2; border: 1px solid #4f4232; box-shadow: 0 8px 40px #000a; }
      .pl-menu-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #4f423288; }
      .pl-menu-head h3 { margin: 0; font: 400 18px/1 'IM Fell English', Georgia, serif; letter-spacing: 0.06em; color: #ece3d0; }
      .pl-menu-body { overflow-y: auto; padding: 6px 14px 12px; }
      .pl-menu-body > button { display: block; width: 100%; margin: 4px 0; text-align: left; }
      .pl-menu-body h4 { margin: 10px 0 2px; color: #7a6f5e; font: 600 11px/1.2 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
      .pl-act { display: flex !important; justify-content: space-between; gap: 10px; }
      .pl-closed { opacity: 0.55; }
      .pl-min { color: #7a6f5e; }
      .pl-note { color: #7a6f5e; margin: 6px 0; }
      .pl-digest { margin: 4px 0 0; padding-left: 18px; color: #cfd6dc; }
      .pl-digest li { margin: 4px 0; }
      .pl-heard { color: #b9ad96; font-style: italic; }
      @media (max-width: 760px) { .pk-panel { left: 12px; bottom: 12px; width: auto; } }
      /* The town's weekly paper (src/app/paperPanel.ts), beside Sound in play. */
      .pp-backdrop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: #050607b3; }
      .pp-panel { position: relative; width: min(640px, 100%); max-height: min(86vh, 860px); overflow-y: auto; background: #efe8d8; color: #1d1b17; box-shadow: 0 8px 40px #000c; font: 15px/1.4 Georgia, 'Times New Roman', serif; }
      .pp-close { position: absolute; right: 10px; top: 10px; padding: 3px 9px; border: 1px solid #1d1b1766; border-radius: 3px; background: none; color: #1d1b17; font: 12px/1.3 'Alegreya Sans', system-ui, sans-serif; cursor: pointer; }
      .pp-body { padding: 18px 26px 24px; }
      .pp-mast { text-align: center; border-bottom: 3px double #1d1b17; padding-bottom: 6px; margin-bottom: 14px; }
      .pp-mast h2 { margin: 0; font: 400 34px/1.1 'IM Fell English', Georgia, serif; letter-spacing: 0.02em; }
      .pp-dated { margin-top: 4px; font: 12px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
      .pp-lead h3 { margin: 0 0 6px; font: 700 26px/1.15 Georgia, serif; }
      .pp-lead p { margin: 0 0 12px; font-size: 16px; }
      .pp-section { border-top: 1px solid #1d1b1755; margin-top: 12px; padding-top: 8px; }
      .pp-section h5 { margin: 0 0 6px; font: 600 12px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
      .pp-story h4 { margin: 6px 0 2px; font: 700 16px/1.25 Georgia, serif; }
      .pp-story p { margin: 0; }
      .pp-empty { font-style: italic; text-align: center; }
      /* The town map (src/app/mapPanel.ts), beside the paper in play. */
      .mm { position: fixed; right: calc(var(--right) + 14px); bottom: 14px; z-index: 21; width: 184px; height: 184px; }
      .mm-canvas { display: block; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #4f4232; box-sizing: border-box; box-shadow: 0 4px 18px #000a; background: #efe8d8; cursor: pointer; touch-action: none; }
      .mm-turn { position: absolute; right: 2px; top: 2px; width: 28px; height: 28px; padding: 0; border: 1px solid #4f4232; border-radius: 50%; background: #0d0f11e6; color: #ece3d0; font: 600 13px/1 'Alegreya Sans', system-ui, sans-serif; cursor: pointer; }
      .mm-turn:hover, .mm-turn:focus-visible { border-color: #e9b85c; outline: none; }
      body.title-up .mm { display: none; }
      @media (max-width: 760px) { .mm { width: 132px; height: 132px; } }
      .map-backdrop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: #050607b3; }
      .map-panel { position: relative; width: min(1000px, 100%); height: min(86vh, 900px); background: #efe8d8; box-shadow: 0 8px 40px #000c; }
      .map-canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
      .map-tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
      .map-tools button { padding: 3px 9px; border: 1px solid #1d1b1766; border-radius: 3px; background: #efe8d8e6; color: #1d1b17; font: 13px/1.3 'Alegreya Sans', system-ui, sans-serif; cursor: pointer; }
      #hud { position: fixed; left: 14px; top: 40px; pointer-events: none; white-space: pre; font-size: 12px; opacity: 0.75; text-shadow: 0 1px 2px #000; }
      /* The screen's frame (src/app/shell.ts): the top bar and the one menu. Chat keeps the right-hand side while open. */
      :root { --right: 0px; }
      body.chat-open { --right: var(--chat-w, 0px); }
      .sh-bar { position: fixed; left: 0; right: var(--right); top: 0; z-index: 24; display: flex; align-items: center; gap: 18px; height: 36px; padding: 0 100px 0 14px; box-sizing: border-box; background: linear-gradient(#050607d9, #05060700); color: #ece3d0; font: 15px/1 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.04em; text-shadow: 0 1px 2px #000; pointer-events: none; }
      .sh-bar.sh-empty { display: none; }
      .sh-said { color: #e9b85c; }
      .sh-tools { position: fixed; top: 6px; right: calc(var(--right) + 12px); z-index: 26; display: flex; gap: 6px; }
      .sh-menu-button { padding: 4px 14px; border: 1px solid #4f4232aa; border-radius: 3px; background: #050607cc; color: #cfd6dc; font: 13px/1.3 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.08em; cursor: pointer; }
      .sh-menu-button:hover, .sh-menu-button:focus-visible, .sh-menu-button[aria-expanded=true] { color: #ece3d0; border-color: #e9b85c; outline: none; }
      .sh-menu { position: fixed; top: 40px; right: calc(var(--right) + 12px); z-index: 30; width: min(240px, calc(100vw - 24px)); max-height: calc(100vh - 52px); overflow-y: auto; padding: 6px 0 8px; box-sizing: border-box; background: #0d0f11f2; border: 1px solid #4f4232; box-shadow: 0 8px 40px #000a; font: 14px/1.3 'Alegreya Sans', system-ui, sans-serif; }
      .sh-menu h3 { margin: 8px 14px 3px; font: 600 11px/1 'Alegreya Sans', system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #7a6f5e; }
      .sh-item { display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 5px 14px; border: 0; background: none; color: #cfd6dc; font: inherit; text-align: left; cursor: pointer; }
      .sh-item:hover, .sh-item:focus-visible { background: #e9b85c1a; color: #ece3d0; outline: none; }
      .sh-note { color: #7a6f5e; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="loading"><canvas class="ti-scene" aria-hidden="true"></canvas><h1 class="name">Total Town</h1><div class="ti-badge">Alpha</div><div class="ti-go"><span class="ti-click">Click to start</span></div><div class="bar"><i></i></div><div class="step">Loading</div></div>
    <noscript><p style="position:fixed;inset:0;z-index:30;margin:0;padding:40vh 16px 0;text-align:center;background:#050607">Total Town needs JavaScript.</p></noscript>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
